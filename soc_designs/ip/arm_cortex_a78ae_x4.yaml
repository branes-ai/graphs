id: arm_cortex_a78ae_x4
name: Arm Cortex-A78AE cluster (4 cores)
vendor: Arm
engine_kind: cpu
silicon:
- name: core_logic
  circuit_class: hp_logic
  unanchored: true
  source: No trustworthy absolute Cortex-A78 / A78AE core area is public. Arm discloses only relative
    figures ('5% smaller than A77'); a 1.33 mm^2 figure circulates second-hand without its node or scope.
  confidence: unknown
- name: l1_caches
  circuit_class: sram_hd
  mtx: 26.624
  source: 64 KB L1I + 64 KB L1D per core, 4 cores (NVIDIA Jetson AGX Orin Series Technical Brief, TB_10749-001_v1.2
    (July 2022), Table 1); 512 KiB x 0.052 Mtx/KiB, 6T cell + periphery (silicon_math.SRAM_MTX_PER_KIB)
  confidence: theoretical
- name: l2_caches
  circuit_class: sram_hd
  mtx: 53.248
  source: 256 KB L2 per core, 4 cores (NVIDIA Jetson AGX Orin Series Technical Brief, TB_10749-001_v1.2
    (July 2022), Table 1); 1024 KiB x 0.052 Mtx/KiB, 6T cell + periphery (silicon_math.SRAM_MTX_PER_KIB)
  confidence: theoretical
- name: l3_cache
  circuit_class: sram_hd
  mtx: 106.496
  source: 2 MB L3 per cluster (NVIDIA Jetson AGX Orin Series Technical Brief, TB_10749-001_v1.2 (July
    2022), Table 1); 2048 KiB x 0.052 Mtx/KiB, 6T cell + periphery (silicon_math.SRAM_MTX_PER_KIB)
  confidence: theoretical
compute:
  engine_kind: cpu
  units: 4
  unit_name: core
  ops_per_clock:
    int8: 256.0
    fp16: 128.0
    fp32: 64.0
    fp64: 32.0
  architecture_class: stored_program
  source: 3 clusters of 4 Cortex-A78AE cores (NVIDIA Jetson AGX Orin Series Technical Brief, TB_10749-001_v1.2
    (July 2022), Table 1). Per-core peaks from the issue rates in the Arm Cortex-A78AE Core Software
    Optimization Guide (PJDOC-466751330-14665, Issue 4.0), section 3.1 -- 'ASIMD FP multiply accumulate
    FMLA, FMLS' throughput 2 per cycle and 'ASIMD dot product SDOT, UDOT' throughput 2 per cycle, both on
    the V pipes -- on 128-bit vectors, with a multiply-accumulate counted as 2 ops. FP32 2 x 4 lanes x 2 =
    16, FP64 8, FP16 32 (the FMLA row, Armv8.2 half precision), INT8 2 x 16 MACs x 2 = 64 ops per clock per
    core; per 4-core instance 64 / 32 / 128 / 256. Issue-rate peaks, not attained.
clock:
  fmax_ghz_ref: 2.2
  reference_node: samsung_8lpp
  source: Max CPU frequency 2.2 GHz, Jetson AGX Orin 64GB (NVIDIA Jetson AGX Orin Series Technical Brief,
    TB_10749-001_v1.2 (July 2022), Table 1)
