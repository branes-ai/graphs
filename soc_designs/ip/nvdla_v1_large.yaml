id: nvdla_v1_large
name: NVDLA v1 'large' (2048 INT8 MACs)
vendor: NVIDIA (open source)
engine_kind: npu
silicon:
- name: dla_logic
  circuit_class: balanced_logic
  reference_area_mm2: 2.8562666666666665
  reference_node: tsmc_n16
  source: 'NVDLA Primer, synthesis results table (nvdla.org/primer.html): the 2048-MAC configuration with
    a 512 KB convolution buffer synthesizes to 3.3 mm^2 at 16 nm, all memories included. Logic is that
    total less the convolution buffer priced below (0.4437 mm^2 at tsmc_n16): 2.8563 mm^2.'
  confidence: theoretical
  notes: Synthesis area, not silicon. The Primer does not split logic from memory, so this line is the
    total less a 6T estimate of the one large buffer; the smaller internal memories stay in it, at logic
    density.
- name: conv_buffer
  circuit_class: sram_hd
  mtx: 26.624
  source: 512 KB convolution buffer (NVDLA Primer); 512 KiB x 0.052 Mtx/KiB, 6T cell + periphery (silicon_math.SRAM_MTX_PER_KIB)
  confidence: theoretical
  notes: 'Split out so it retargets at SRAM density rather than logic density (CodeRabbit on #303).'
compute:
  engine_kind: npu
  units: 1
  unit_name: DLA
  ops_per_clock:
    int8: 4096.0
  source: 2048 INT8 MACs x 2 ops (NVDLA Primer)
clock:
  fmax_ghz_ref: 1.0
  reference_node: tsmc_n16
  source: Primer figures are quoted at 1 GHz
