notes: 'Foundry-stated speed gains between process nodes, for retargeting a block''s rated clock from
  the node it was characterized on (graphs#269 PR 2.3). Each relation records the power condition its
  source states. Only iso_power relations retarget a clock; a gain whose source states no condition is
  recorded as unstated and not used, because a speed gain bought with more power is not a clock the same
  block reaches in the same budget. Research, 2026-09-18: threshold voltages, the FinFET alpha-power
  exponent, and any Samsung-vs-TSMC relation were not found in public sources, so Vdd scaling is not
  modeled.'
relations:
- from_node: tsmc_n16
  to_node: tsmc_n7
  speed_ratio:
    low: 1.3
    high: 1.35
  power_condition: iso_power
  source: 'TSMC, ''TSMC''s Industry-first and Leading 7nm Technology Enters Volume Production'' (esg.tsmc.com
    case study 9, July 2018): "around 35% speed gain at the same power, or around 65% power reduction
    at the same speed" vs 16FF+. The low end is TSMC''s smartphone-platform page, "up to a 30% speed
    improvement, a 55% power saving" over N16, which states no condition; it is kept only as the
    conservative end, where it can lower a retargeted clock but never raise one above the iso-power figure.'
  confidence: theoretical
- from_node: tsmc_n7
  to_node: tsmc_n5
  speed_ratio:
    low: 1.15
    high: 1.15
  power_condition: unstated
  source: 'TSMC press release ''TSMC and OIP Ecosystem Partners Deliver Industry''s First Complete Design
    Infrastructure for 5nm Process Technology'' (pr.tsmc.com/english/news/1987, 3 April 2019): "1.8X logic
    density and 15% speed gain on an ARM Cortex-A72 core" -- no power condition. Trade press reports it
    as "at the same power" (Tom''s Hardware); TSMC''s own text does not, and the 2020 Annual Report gives
    N5P as "about 20% faster speed than N7 technology or about 40% power reduction", also without one.'
  confidence: theoretical
- from_node: tsmc_n5
  to_node: tsmc_n4p
  speed_ratio:
    low: 1.11
    high: 1.11
  power_condition: unstated
  source: 'TSMC press release ''TSMC Expands Advanced Technology Leadership with N4P Process'' (pr.tsmc.com/english/news/2874,
    26 Oct 2021): "11% performance boost over the original N5 technology" and, separately, "22%
    improvement in power efficiency" -- no power condition on the 11%.'
  confidence: theoretical
