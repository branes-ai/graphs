id: kpu_t128_n16
name: KPU-T128 at tsmc_n16 (Orin-class platform)
process_node: tsmc_n16
blocks:
- instance: kpu
  ip: kpu_t128_core_n16
  count: 1
  notes: The T128 KPU core, generated from ComputeProduct kpu_t128_32x32_lp5x8_16nm_tsmc_ffp, which states
    its clock at tsmc_n16. It replaces the GPU SMs, GPU L2, both DLAs and the PVA.
- instance: cpu
  ip: arm_cortex_a78ae_x4
  count: 3
  notes: The Orin-class CPU complement. A study sweeps block:cpu.count, so the cluster count is an axis
    rather than a design.
- instance: isp
  ip: nvidia_orin_hdr_isp
- instance: codec
  ip: nvidia_orin_video_codec
- instance: system_cache
  ip: orin_system_cache
- instance: safety_island
  ip: orin_safety_island
- instance: memory
  ip: lpddr5_phy_256b
  notes: The reference platform's 256-bit LPDDR5. A study sweeps block:memory.ip over the wider options,
    because far flight needs more bandwidth than this delivers whatever the accelerator is.
- instance: io
  ip: orin_io_complex
- instance: fabric
  ip: orin_fabric
layout:
  whitespace_fraction: 0.15
  io_ring_mm: 0.3
  source: The reference design's layout overheads, kept equal across the state space so area differences
    come from the blocks.
notes: One point of the CPU + KPU design state space (graphs#269 Phase 7), generated by tools/generate_kpu_soc_designs.py;
  do not edit by hand. The node is the one kpu_t128_32x32_lp5x8_16nm_tsmc_ffp states its clock at, so
  nothing here is provisional.
