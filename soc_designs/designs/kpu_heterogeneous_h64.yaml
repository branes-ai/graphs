id: kpu_heterogeneous_h64
name: KPU-heterogeneous (Orin-class platform, H64 KPU in place of GPU/DLA/PVA)
process_node: tsmc_n7
blocks:
- instance: kpu
  ip: kpu_h64_core
  count: 1
  notes: The H64 KPU core (generated from ComputeProduct kpu_h64_auto1_lp5x4_7nm_tsmc_hpc)
    replaces the GPU SMs, GPU L2, both DLAs and the PVA. Its systolic, LNS and fixed-function
    tiles are unanchored in the SKU, so the block is a lower bound.
- instance: cpu
  ip: arm_cortex_a78ae_x4
  count: 3
  notes: The same CPU complement as the Orin-class reference, so the comparison isolates the
    accelerator.
- instance: isp
  ip: nvidia_orin_hdr_isp
- instance: codec
  ip: nvidia_orin_video_codec
- instance: system_cache
  ip: orin_system_cache
- instance: safety_island
  ip: orin_safety_island
- instance: memory
  ip: lpddr5_phy_256b
  notes: The same 256-bit LPDDR5 as the reference; the KPU core shares the SoC memory system
    instead of bringing its chip's own x4 PHYs.
- instance: io
  ip: orin_io_complex
- instance: fabric
  ip: orin_fabric
layout:
  whitespace_fraction: 0.15
  io_ring_mm: 0.3
  source: The reference design's layout overheads, kept equal so area differences come from the
    blocks.
notes: >-
  The Phase 4 comparison design (graphs#269 PR 4.3): the Orin-class platform with its
  data-parallel and DLA accelerators replaced by a heterogeneous KPU. Everything but the
  accelerator is the reference's IP, including its unanchored silicon, so area differences are
  the accelerators' -- where both are priced.
