id: annex_v1
name: Data Annex pooled class throughput
kind: pooled
pooled:
  a: 2000.0
  b: 300.0
  c: 15.0
  confidence: theoretical
  source: >-
    BranesAI Autonomy Workload Data Annex (2026-09-17), section 2: effective
    throughput per precision class on an Orin-class part -- Class A 2,000,
    Class B 300, Class C 15 GOP/s. Stated assumptions anchored to the fastest
    batch-1 result in the annex's 360-configuration measurement corpus, and
    described there as generous on B and C; not measurements of this workload.
    The same figures are graphs.core.pipeline_workload.DEFAULT_THROUGHPUT.
notes: >-
  The annex's own model: the SoC as one pooled machine, no mapping of stages
  to engines. It is the Phase 3 regression target (decision P3-D1): with it,
  the analyzer must reproduce the annex's oversubscription and stages-over on
  every profile.
