kind: kpu_domainflow_ceilings/1
notes: 'Generated by tools/generate_kpu_ceilings.py; do not edit by hand. Each value is an UPPER BOUND
  on what the fabric could sustain on that kernel: the least of the wavefront schedule, the compulsory
  DRAM traffic and, where the tile class states an interconnect, operand delivery. A ceiling is not an
  efficiency -- it says what cannot be exceeded, never what will be achieved -- so this is not an efficiency
  table and no analysis prices a stage with it.'
