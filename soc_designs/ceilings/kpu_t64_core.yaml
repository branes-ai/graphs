no_schedule:
  fft: a radix-2 FFT is not a polyhedral GEMM schedule on this fabric
  small_dense_linalg: a Cholesky factorization's dependences are triangular, not a rectangular wavefront
  small_qp: an LU on a KKT system is triangular, as above
  sparse_hash_scatter: scatter-add is addressing, not a wavefront
