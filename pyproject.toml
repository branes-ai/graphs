[project]
name = "graphs"
version = "0.8.0"
description = "Synthetic DNN graph models and characterization tools"
requires-python = ">=3.10"
authors = [
    { name = "Branes.ai Team", email = "software@branes.ai"},
    { name = "Theodore Omtzigt", email = "theodore.omtzigt@branes.ai"},
    { name = "Domjan Baric", email = "domjan.baric@branes.ai"},
    { name = "Kishore Kondapi", email = "kishore.kondapi@branes.ai"}
]
dependencies = ["torch", "torchvision", "pandas", "psutil", "py-cpuinfo", "pyyaml"]

[project.optional-dependencies]
# For verdict-first output to agentic workflows. >=0.9.0: first release with
# the KPU B2-B6 fields (overlays, tile kinds, checkerboard / power domains,
# performance roll-up, tile_class_ref) that the KPU golden snapshots record;
# 0.8.0 added the B1 tile fields, 0.7.0 the ComputeProduct / ProcessNode / KPU
# catalogs and KPUBlock.from_architecture, and 0.6.0 predates all of them.
schemas = ["embodied-schemas>=0.13.0"]
# MCP server for authenticated remote access to estimators
mcp = ["mcp>=1.0.0", "starlette>=0.27", "uvicorn>=0.23"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["graphs*"]
exclude = ["graphs.*.tests*", "graphs.*.__pycache__*"]

