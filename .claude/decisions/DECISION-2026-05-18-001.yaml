# ============================================================================
# RISK ASSESSMENT
# ============================================================================
risks:
  - risk: "Tensor-first ordering breaks down on SKUs where the 'primary' fabric is ambiguous"
    mitigation: "Per-SKU judgment call documented in YAML notes. Multi-fabric SKUs without a clear primary (e.g., heterogeneous-precision designs where vector and tensor each own different precisions) may need a per-SKU drift-acceptance call. The convention is a default, not a mandate."
    severity: "low"
    likelihood: "low"
  - risk: "BOM overlay creates two sources of truth (YAML + wrapper)"
    mitigation: "Convention is to attach BOM only when the hand-coded factory had it. Future v11+ sprint can promote BOM into the YAML schema once more vendors publish BOM data. Documented as v11+ candidate in compute_block_common docstring."
    severity: "low"
    likelihood: "medium"
  - risk: "Inheritance-based unification adds a second pattern alongside alias-based (cognitive load)"
    mitigation: "Decision criteria documented: use inheritance when per-kind enums must stay typed; use alias when target classes are byte-identical. Both v10 paper exercise and OnDieFabric module docstring explain the choice."
    severity: "low"
    likelihood: "low"
  - risk: "v11 CGRA rename was the first hard schema break -- future renames now have a precedent that could be applied carelessly"
    mitigation: "v11 paper exercise documented the specific conditions: only when the rename eliminates a 5-vs-1 inconsistency AND a discriminator preserves the lost semantic. Future renames should follow the same paper-exercise template."
    severity: "medium"
    likelihood: "low"

