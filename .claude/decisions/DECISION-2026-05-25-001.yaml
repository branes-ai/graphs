# ============================================================================
# SUMMARY
# ============================================================================
summary: >
  Make KPU predicted average power physical via a three-layer approach:
  (1) a thermal-bound latency clamp as a hard backstop, (2) leakage that
  scales with Vdd, (3) dynamic energy single-sourced from the ProcessNode
  with the 2x MAC/FLOP double-count fixed -- preserving the round catalog
  TDPs by re-tuning profile Vdd rather than overwriting derived values.

# ============================================================================
# TRIGGER
# ============================================================================
trigger:
  type: "error_encountered"
  content: >
    KPU energy estimates violated the avg_power <= TDP invariant by 18-37x
    (T64 reported 110-1175 W on a 6 W TDP). Cluster: #177, #121, #154, #81.
  context: >
    The KPU has no silicon to measure against; the energy model is analytical.
    TDP is derived assuming ~15% compute duty cycle (well-tiled inference),
    but dense GEMM runs ~100% duty, so peak compute power genuinely exceeds
    the duty-cycle-derived envelope. Three parallel energy representations
    existed (energy_per_flop_fp32, tile_energy_model.mac_energy, ProcessNode
    energy_per_op_pj) plus a hardcoded energy_scaling table.

# ============================================================================
# ALTERNATIVES CONSIDERED
# ============================================================================
alternatives:
  - option: "Clamp energy down (cap avg_power by scaling reported joules)"
    pros:
      - "Keeps reported burst latency truthful"
    cons:
      - "Fakes the physical energy of the work; FLOPs cost what they cost"
      - "Corrupts inf/J efficiency, the KPU's headline metric"
    selected: false
    rejected_reason: >
      Energy is a physical quantity. Lowering it to satisfy a power ceiling
      is dishonest; the right free variable is sustained latency.

  - option: "Thermal-bound latency clamp (latency = max(burst, energy/TDP))"
    pros:
      - "Energy stays physical; only sustained throughput is thermally bound"
      - "Standard thermal-bound roofline; universal across all mappers"
      - "Inert unless avg power would breach TDP (low blast radius)"
    cons:
      - "Reported sustained latency > burst latency for power-bound ops"
    selected: true
    selected_reason: >
      Physically correct: a 6 W-envelope chip cannot sustain ~20 W of dense
      GEMM; it throttles. Implemented in #251 as the hard backstop.

  - option: "#81: single-source from tile_energy_model (aggressive domain-flow)"
    pros:
      - "Unambiguously per-MAC (clean unit conversion)"
      - "Reflects the KPU's claimed domain-flow efficiency advantage"
    cons:
      - "~9x FP32 efficiency swing; large, optimistic headline change"
      - "Diverges from the user's stated 'derive from ProcessNode' direction"
    selected: false
    rejected_reason: "User chose the conservative node-physics source."

  - option: "#81: single-source from ProcessNode energy_per_op_pj (+ fix 2x)"
    pros:
      - "Conservative, node-physics-based, single source of truth"
      - "Eliminates the parallel PROCESS_NODE_ENERGY table drift for KPU"
    cons:
      - "Small numeric change vs the aggressive tile model"
    selected: true
    selected_reason: >
      Matches the user's pick. node energy_per_op_pj is per-MAC (proven by the
      loader feeding the same figure to tile_energy_model.mac_energy), and
      sg.flops is 2 FLOPs/MAC, so per-FLOP base = node_fp32/2.

  - option: "#154: overwrite catalog TDPs with new (off-round) derived values"
    pros:
      - "Generator stays the single source; no re-tuning"
    cons:
      - "Loses the round product-envelope labels (3/6/10 W ...)"
    selected: false
    rejected_reason: "User reverted this approach; round TDPs are the spec."

  - option: "#154: re-tune profile Vdd so the model derives the round TDPs"
    pros:
      - "Preserves round envelope labels AND the roundtrip invariant"
      - "Vdd-only; clock and advertised TOPS unchanged"
    cons:
      - "Per-profile Vdd values become non-round (e.g. 0.636)"
    selected: true
    selected_reason: >
      The architect tunes (clock, Vdd) to hit a thermal envelope; re-tuning Vdd
      is exactly that design act. Solved by bisection (embodied-schemas #85).

