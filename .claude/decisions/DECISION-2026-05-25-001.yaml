      They are within the node DVFS range; the roundtrip invariant (stored ==
      derived within 0.5 W) keeps them honest against the power model.
    severity: "low"
    likelihood: "low"
  - risk: "leakage_vdd_exponent values (n16: 4.0, n7: 4.5) are THEORETICAL"
    mitigation: >
      Cited from FinFET sub-threshold + DIBL scaling; backward-compatible
      (default None = flat). Replace with PDK characterization when available.
    severity: "low"
    likelihood: "medium"
  - risk: "Halving energy_per_flop changes KPU inf/J vs prior reports"
    mitigation: >
      It removes a genuine 2x double-count; new effective per-MAC energies
      equal the published node values and are pinned by a regression test.
    severity: "medium"
    likelihood: "low"

