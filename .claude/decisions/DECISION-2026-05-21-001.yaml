#
# Two campaign-level architectural calls established during the
# PhysicalSpec backfill arc (sprints #62, #68, #72):
#   1. Single-virtual-die approximation for chiplet products (no IOBlock kind)
#   2. Closing #241 at 91% coverage as "data-availability ceiling reached"

decision_id: "DECISION-2026-05-21-001"
timestamp: "2026-05-21T22:00:00Z"
