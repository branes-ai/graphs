version: branes_7tier_v1
provenance:
  document: BranesAI Autonomy Workload Data Annex
  section: stage unit costs (derive.py), missions (profiles.py), service-time model (pipeline.py)
  dated: '2026-09-17'
  note: Generated by tools/generate_autonomy_workload.py from docs/workload-model/; do not edit by hand.
    Regime labels and published figures are from BranesAI-Autonomy-Compute-Requirements.pdf (2026-09-13),
    section 4.
effective_throughput_gops:
  A: 2000.0
  B: 300.0
  C: 15.0
stages:
- key: lidar
  name: LiDAR deskew + voxel downsample
  pipeline_tier: T1
  unit: per input point
  ops_per_call: 170.0
  bytes_per_call: 214.0
  class_split:
    C: 1.0
  config:
    points per revolution: ~100 k
    voxel edge: 0.10 m
    hash load factor: '0.7'
  basis: SE(3) motion compensation per FAST-LIO2 / LOAM deskew; voxel-hash downsample. Byte count is cache-line
    granular because the hash probe is scattered.
- key: sgm
  name: Stereo rectify + SGM disparity
  pipeline_tier: T1
  unit: per stereo frame-pair
  ops_per_call: 6388761600.0
  bytes_per_call: 1629849600.0
  class_split:
    A: 0.85
    C: 0.15
  config:
    resolution: 1440x1080 mono
    disparities: '128'
    aggregation paths: '4'
    cost: Census 5x5 + Hamming
  basis: Semi-global matching per Hirschmuller, 4-path real-time variant with Census-Hamming cost. Cost-volume
    traffic assumes competent tiling; an untiled implementation moves an order of magnitude more.
- key: radar
  name: Radar FMCW post-processing
  pipeline_tier: T1
  unit: per radar scan
  ops_per_call: 939524096.0
  bytes_per_call: 303054848.0
  class_split:
    A: 0.7
    C: 0.3
  config:
    virtual channels: '32'
    range samples: '1024'
    chirps per frame: '256'
    array: 4 Tx x 8 Rx MIMO
  basis: "Standard FMCW MIMO chain: range FFT, Doppler FFT, CFAR, angle estimation. Aperture is the dominant\
    \ assumption \u2014 a 12-channel 512x128 radar costs ~12x less."
- key: mono
  name: Mono camera front-end
  pipeline_tier: T1
  unit: per pixel
  ops_per_call: 40.0
  bytes_per_call: 4.0
  class_split:
    C: 1.0
  config:
    assumption: demosaic and denoise performed in the sensor ISP
  basis: Light path only. A full software ISP (demosaic + 3DNR) would add roughly 35 op/px.
- key: lio
  name: LiDAR-inertial odometry
  pipeline_tier: T2
  unit: per input point
  ops_per_call: 6144.0
  bytes_per_call: 1048.0
  class_split:
    C: 1.0
  config:
    ikd-tree size: ~1e5 nodes
    kNN k: '5'
    IEKF iterations: '3'
    downsampling into optimizer: "none \u2014 all deskewed points used"
  basis: 'FAST-LIO2-class iterated-EKF formulation. The no-downsampling assumption is the single largest
    lever in this stage: 10x decimation into the optimizer divides it by ~10.'
- key: vio
  name: Visual front-end (per camera)
  pipeline_tier: T2
  unit: per pixel
  ops_per_call: 123.95293209876543
  bytes_per_call: 17.61111111111111
  class_split:
    A: 0.6
    C: 0.4
  config:
    tracked features: '300'
    KLT window: 21x21
    pyramid levels: '4'
    KLT iterations per level: '20'
  basis: FAST/Shi-Tomasi extraction with pyramidal Lucas-Kanade tracking. Cost is dominated by the KLT
    term, which scales with feature count, not resolution.
- key: ba
  name: Windowed bundle adjustment
  pipeline_tier: T2
  unit: per solve
  ops_per_call: 168815000.0
  bytes_per_call: 3797520.0
  class_split:
    C: 1.0
  config:
    keyframes in window: '15'
    landmarks: '800'
    cameras: '2'
    LM iterations: '5'
  basis: Schur-complement bundle adjustment with Levenberg-Marquardt. Cost scales as the cube of the keyframe
    window and linearly in landmarks; the window size is the lever.
- key: tsdf
  name: TSDF integration
  pipeline_tier: T3
  unit: per measured point
  ops_per_call: 3708.0
  bytes_per_call: 1193.0
  class_split:
    C: 1.0
  config:
    voxel edge: 0.05 m
    truncation: +/-0.3 m
    sensor range: 30.0 m
    free-space carving: 1 voxel in 5 along the ray
  basis: Bundled raycasting with weighted truncated SDF update, per Voxblox/nvblox. Free-space carving
    density is the main lever; band-only integration costs ~11x less.
- key: esdf
  name: ESDF propagation
  pipeline_tier: T3
  unit: per map update
  ops_per_call: 780000000.0
  bytes_per_call: 15840000.0
  class_split:
    C: 1.0
  config:
    voxels changed per update: 400,000
    neighborhood: 26-connected
    wavefront passes: '3'
  basis: Incremental brushfire/wavefront over the TSDF. The changed-voxel count scales with platform speed
    and is the dominant assumption.
- key: det
  name: Open-vocabulary detection
  pipeline_tier: T4
  unit: per inference
  ops_per_call: 90336864000.0
  bytes_per_call: 170539520.0
  class_split:
    A: 0.85
    B: 0.15
  config:
    backbone: YOLOe / YOLO-World class
    parameters: 24 M
    input: 640x640
    text embeddings: precomputed and cached
  basis: Anchored to the published FLOP count of a YOLOe-class open-vocabulary detector at 640x640. This
    is the best-supported unit cost in the model.
- key: vlm
  name: Onboard vision-language reasoning
  pipeline_tier: T4
  unit: per query
  ops_per_call: 2816000000000.0
  bytes_per_call: 130174063616.0
  class_split:
    A: 0.6
    B: 0.4
  config:
    parameters: 2 B
    quantization: INT8 weights
    prefill tokens: '600'
    decode tokens: '64'
  basis: Transformer arithmetic is 2 ops per parameter per token. Decode re-reads the entire weight set
    per token, which is why this stage is bandwidth-bound rather than compute-bound.
- key: vla
  name: Vision-language-action policy
  pipeline_tier: T4
  unit: per action-chunk step
  ops_per_call: 378000000000.0
  bytes_per_call: 3018923520.0
  class_split:
    A: 0.6
    B: 0.4
  config:
    backbone: 3 B
    tokens per forward pass: '56'
    action chunking: 8 control steps per pass
  basis: Chunked VLA in the pi-0 / OpenVLA family. Chunking amortizes one forward pass over several control
    steps, which is what makes 30 Hz action output affordable at all.
- key: gain
  name: Volumetric information-gain evaluation
  pipeline_tier: T5
  unit: per candidate viewpoint
  ops_per_call: 434000.0
  bytes_per_call: 230408.0
  class_split:
    C: 1.0
  config:
    rays per frustum: '200'
    voxels per ray: '120'
  basis: 'Frustum raycasting per candidate vertex over unknown space. Roughly 1 op per byte: this is memory
    traffic wearing the label of planning.'
- key: graph
  name: Sampling-based graph + collision check
  pipeline_tier: T5
  unit: per replan
  ops_per_call: 16000000.0
  bytes_per_call: 10240000.0
  class_split:
    C: 1.0
  config:
    samples: '2000'
    neighbors per sample: '10'
    collision queries per edge: '50'
  basis: PRM/RRT-class roadmap with edge collision queries against the ESDF. Sample count is the lever
    and varies by more than an order of magnitude between regimes.
- key: sdfenc
  name: Learned SDF encoder (neural SDF-MPC)
  pipeline_tier: T6
  unit: per call
  ops_per_call: 22027787264.0
  bytes_per_call: 54196608.0
  class_split:
    A: 0.85
    B: 0.15
  config:
    input: 64 x 1024 range image
    encoder: conv trunk + MLP SDF head, 6 M params
  basis: Convolutional encoder plus an implicit SDF head, sized to published neural-SDF planners. Class
    A in the trunk, Class B in the head.
- key: policy
  name: Learned navigation policy (DRL)
  pipeline_tier: T6
  unit: per call
  ops_per_call: 9050530432.0
  bytes_per_call: 27600352.0
  class_split:
    A: 0.85
    B: 0.15
  config:
    encoder: depth-collision CNN, 2.5 M params
    head: 3-layer actor MLP
  basis: Actor network only; the critic is not evaluated at inference.
- key: mpc
  name: Nonlinear MPC solve (quadrotor, 4 DoF)
  pipeline_tier: T6
  unit: per solve
  ops_per_call: 1124400.0
  bytes_per_call: 177600.0
  class_split:
    C: 1.0
  config:
    state dim: '12'
    control dim: '4'
    horizon: '30'
    SQP iterations: '5'
  basis: Sequential quadratic programming with a Riccati recursion over the horizon. Cost scales as horizon
    x nx^3, which is why the humanoid case is 100x the quadrotor.
- key: cbf
  name: Composite CBF safety filter
  pipeline_tier: T6
  unit: per solve
  ops_per_call: 29130.0
  bytes_per_call: 8998.0
  class_split:
    C: 1.0
  config:
    decision variables: '3'
    active hazard constraints: '12'
    ESDF window: 15 x 15 x 15 voxels
    QP solver: OSQP / active set
  basis: Weighted virtual-obstacle QP over a sliding map window. The solve itself is trivial; the cost
    is the map sweep that finds which hazards are live.
- key: ctrl
  name: Attitude / rate or joint servo control
  pipeline_tier: T7
  unit: per update per DoF
  ops_per_call: 440.0
  bytes_per_call: 96.0
  class_split:
    C: 1.0
  config:
    controller: cascaded PID or geometric attitude controller
  basis: Runs on the flight-control microcontroller or joint controller, not the mission computer. Included
    for completeness; it is under 0.1% of every mission total.
