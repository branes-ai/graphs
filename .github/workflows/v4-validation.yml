# V4 model-validation gate.
#
# Per the v4 plan exit criterion (docs/plans/validation-harness-v4-plan.md):
#   "First PR blocked by a real drift"
#
# This workflow runs the per-shape regime/latency floor tests + KPU
# consistency invariants on every PR that touches an area where the
# analytical model (or its supporting infrastructure) might drift.
#
# It is intentionally *separate* from the main `CI` workflow so that:
#   * Doc-only PRs don't pay the cost (path filter below).
#   * The check appears as a distinct line in the PR status rollup,
#     so reviewers see "V4 Model Validation" pass/fail without
#     digging through a multi-hundred-test pytest log.
#   * Failures point directly at the failing invariant + its
#     historical floor, via the test docstrings.
#
# What it gates today:
#   * tests/validation_model_v4/                 (78 V4 unit tests)
#   * tests/analysis/test_energy_cpu_active_power.py  (#71 calibration)
#   * tests/analysis/test_roofline_cpu_efficiency.py  (#67 floor)
#   * tests/analysis/test_roofline_cpu_dispatch_floor.py  (#69 floor)
#   * tests/analysis/test_roofline_cpu_bw_efficiency.py   (#74 floor)
#
# To make this a *required* status check, configure branch protection
# on `main` in repo settings -> Branches -> Branch protection rules:
# add "V4 Model Validation" to the required-checks list.

name: V4 Model Validation

# Minimal permissions per the principle of least privilege. The gate
# only needs to check out the source and read it -- no PR comments, no
# release writes, no security tokens. Flagged by CodeQL alert #11/#12
# on the initial PR.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      # Code paths that can shift the analytical model
      - 'src/graphs/estimation/**'
      - 'src/graphs/hardware/**'
      - 'src/graphs/transform/**'
      - 'src/graphs/core/**'
      # The validation harness itself
      - 'validation/model_v4/**'
      # The tests that encode the V4 contract
      - 'tests/validation_model_v4/**'
      - 'tests/analysis/test_energy_cpu_active_power.py'
      - 'tests/analysis/test_roofline_cpu_efficiency.py'
      - 'tests/analysis/test_roofline_cpu_dispatch_floor.py'
      - 'tests/analysis/test_roofline_cpu_bw_efficiency.py'
      # The committed baselines: a CSV change implies a deliberate
      # measurement refresh, which the gate must rerun against.
      - 'validation/model_v4/results/baselines/**'
      # Self-modification of the gate
      - '.github/workflows/v4-validation.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  v4-validation:
    name: V4 Model Validation
    runs-on: ubuntu-latest
    # Put the repo root on sys.path so `from validation.model_v4...` resolves.
    # `graphs.*` comes from the editable install below; `validation/` is not
    # a published package, just a sibling directory whose modules the tests
    # import directly. Without this env var, pytest's default `prepend`
    # import mode adds tests/ (the first __init__-less dir walking up from
    # tests/validation_model_v4/test_*.py) -- which doesn't help for the
    # validation/ tree at the repo root.
    env:
      PYTHONPATH: ${{ github.workspace }}
      # Required by graphs.hardware.physical_spec_loader for the 5
      # YAML-backed factories (#136 Phase 3.5). Pointed at the sibling
      # checkout below.
      EMBODIED_SCHEMAS_DATA_DIR: ${{ github.workspace }}/embodied-schemas/src/embodied_schemas/data
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout embodied-schemas (PhysicalSpec data source)
        uses: actions/checkout@v6
        with:
          repository: branes-ai/embodied-schemas
          # Pinned to embodied-schemas main; bump when later schema
          # changes need to be picked up. History:
          #   PR #9  (e8c6c89) ProcessNode + CoolingSolution + KPU SKU schemas
          #   PR #10 (5abce59) per-(profile, precision) efficiency on KPUThermalProfile
          #   PR #11 (bd61f3c) FP16 throughput backfill on KPU tile classes
          #   PR #12 (3509e68) PROCESS_NODE_DATA_DIR env overlay (Phase 7)
          #   PR #13 (5741e75) per-profile Vdd + ProcessNode SRAM/NoC/DRAM energies
          #   PR #14 (846a0d2) KPU SKU naming convention (kpu_t<N>_..._<foundry>_<library>)
          #   PR #15 (60f210d) ComputeProduct v1 schema (KPU-only, additive)
          #   PR #16 (7babd4c) first ComputeProduct YAML + load_compute_products() loader
          #   PR #17 (845a9f2) remaining 11 KPU SKUs converted to ComputeProduct YAMLs
          #   PR #18 (181d725) retire legacy data/kpus/; load_kpus() becomes shim
          #   PR #19 (6edda84) ComputeProduct v2: GPUBlock added (KPUBlock + GPUBlock in AnyBlock union)
          #   PR #20 (cb7d8e2) first GPU SKU YAML: nvidia_jetson_agx_orin_64gb
          #   PR #21 (4faa8a6) Jetson AGX Thor 128GB YAML + TSMC N4P process node
          #   PR #22 (3547b5d) ComputeProduct v3: CPUBlock added (KPU + GPU + CPU in AnyBlock union)
          #   PR #24 (c57dea7) first CPU SKU YAML: intel_core_i7_12700k + intel_7 process node
          #   PR #25 (df7b87f) ComputeProduct v4: NPUBlock added (KPU+GPU+CPU+NPU in AnyBlock union)
          #   PR #26 (6080305) first NPU SKU YAML: hailo_hailo_8
          #   PR #30 (5d99c4c) KVCacheSpec added to NPUBlock (transformer NPUs)
          #   PR #31 (e4d1835) second NPU SKU YAML: hailo_hailo_10h (first KVCacheSpec user)
          #   PR #32 (f5035fb) GF 28nm process node YAML (Coral Edge TPU precursor)
          #   PR #33 (6e3aadb) third NPU SKU YAML: google_coral_edge_tpu (first systolic NPU)
          #   PR #34 (fd43608) CGRABlock added to ComputeProduct (v5, additive)
          #   PR #35 (51b8287) first CGRA SKU YAML: stanford_plasticine_v2
          #   PR #36 (4befc41) DPUBlock added to ComputeProduct (v6, additive)
          #   PR #37 (aa19f91) first DPU SKU YAML: xilinx_vitis_ai_b4096
          #   PR #38 (e60989b) TPUBlock added to ComputeProduct (v7, additive) + MemoryType.DDR3
          #   PR #39 (9bc4a7a) first TPU SKU YAML: google_tpu_v4 (datacenter, HBM2e, ICI)
          #   PR #61 (6778f13) DSP batch sprint #223 closes (Qualcomm QCS6490 + 8 other DSP SKUs)
          #   PR #65-67 (sprint #62) AMD EPYC 9654/9754/9965 datacenter CPUs + AmpereOne A192/A128
          #   PR #68-71 (sprint #68) Intel Xeon 8490H/8592+/Granite Rapids datacenter CPUs
          #   PR #73-78 (sprint #72) H100 PCIe + T4 + TPU v1/v3/v5p/Edge Pro
          #   PR #79 (c4ac073) v13 IOBlock schema: BlockKind.IO + IOBlock + IOOnDieFabric + ... (#245 PR 2)
          #   PR #80 (961e779) EPYC 9654 multi-die rewrite (first IOBlock SKU) (#245 PR 3)
          #   PR #81 (f6ab228) EPYC 9754 multi-die rewrite (reuses Genoa IOD) (#245 PR 4)
          #   PR #82 (61158ff) EPYC 9965 multi-die rewrite (new Turin IOD) (#245 PR 5, closes IOBlock sprint)
          #   PR #83 (7cc12c4) fix(data): correct memory_bus_bits on Jetson Thor + Orin Nano YAMLs (closes #8)
          #   PR #84 (34826f3) leakage_vdd_exponent on ProcessNodeEntry: Vdd-scaled leakage (graphs #154)
          #   PR #85 (b0e3920) re-tune KPU profile Vdd to preserve round TDPs under Vdd-scaled leakage (graphs #154)
          #   189f0c1 Elma Electronic board-level hardware SKUs (data/hardware/elma; picked up by this pin)
          #   PR #86 (755405a) KPUArchitectureBase: KPUArchitecture/KPUBlock share one field set (graphs #268 A1)
          #   PR #87 (b2baa38) release v0.7.0 -- version bump + CHANGELOG only (tag v0.7.0, on PyPI)
          #   PR #88 (77ca00a) KPU B1: datapath schemas + optional heterogeneous-tile fields (graphs #268 B1)
          #   PR #89 (6d50e4f) release v0.8.0 -- version bump + CHANGELOG only (tag v0.8.0, on PyPI)
          #   PR #90 (b675957) KPU B2: PE-level + NoC-level interconnect overlays (graphs #268 B2)
          #   PR #91 (5584d38) KPU B3: systolic / fixed-function tile kinds + FunctionCore (graphs #268 B3)
          #   PR #92 (e8fa698) KPU B4: checkerboard, power domains, per-domain operating points (graphs #268 B4)
          #   PR #93 (d9194f4) KPU B5: performance roll-up by tile kind (graphs #268 B5)
          #   PR #94 (f0df37f) KPU B6: tile-class library + n40/n65 anchor nodes (graphs #268 B6)
          #   PR #95 (c00a88a) release v0.9.0 -- version bump + CHANGELOG only (tag v0.9.0, on PyPI)
          #   PR #97 (cd119f8) kpu_h64_auto1 heterogeneous reference SKUs, v0.10.0 (graphs #268 E1; tag v0.10.0, on PyPI)
          #   PR #98 (067bc19) L1 is per compute tile, not per PE; l1_sram block, v0.11.0 (graphs #268 F1; tag v0.11.0, on PyPI)
          #   PR #99 (6a12905) Vdd re-tune for the four 7nm_tsmc_hpc SKUs, v0.12.0 (graphs #268 F4; tag v0.12.0, on PyPI)
          #   PR #100 (ede4f8b) default per-cluster DVFS partition on the uniform SKUs, v0.13.0 (graphs #268 F2; tag v0.13.0, on PyPI)
          #   PR #101 (3ec7aa0) T768 Matrix class as a systolic tile, v0.14.0 (graphs #268 D8; tag v0.14.0, on PyPI)
          ref: 3ec7aa09bbc42af05b4ccff84a1e76657d4f50cb
          path: embodied-schemas
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py3.10-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py3.10-pip-

      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install -e ./embodied-schemas
          pip install pytest

      - name: Run V4 harness unit tests
        run: |
          pytest tests/validation_model_v4/ -v --tb=short

      - name: Run V4-anchored CPU regression tests
        run: |
          # These four files lock in the V4 baseline floors that #67,
          # #69, #71, and #74 established. Any change to the analyzer
          # that regresses below these floors fails the gate.
          pytest \
            tests/analysis/test_roofline_cpu_efficiency.py \
            tests/analysis/test_roofline_cpu_dispatch_floor.py \
            tests/analysis/test_roofline_cpu_bw_efficiency.py \
            tests/analysis/test_energy_cpu_active_power.py \
            -v --tb=short

      - name: Summary
        if: always()
        run: |
          echo "## V4 Model Validation gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Gates the analytical-model layer per the v4 plan." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Failure here means one of:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "* A change to \`src/graphs/estimation/\` shifted a per-shape regime/latency band off floor." >> $GITHUB_STEP_SUMMARY
          echo "* A change to \`src/graphs/hardware/\` shifted a peak FLOPS / BW spec." >> $GITHUB_STEP_SUMMARY
          echo "* A change to a hardware mapper broke a KPU invariant (achieved <= peak, monotonicity, etc.)." >> $GITHUB_STEP_SUMMARY
          echo "* A change to \`src/graphs/transform/\` broke partitioner round-tripping." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The failing test's docstring will name the specific issue (e.g., #67 for compute efficiency curve)." >> $GITHUB_STEP_SUMMARY
